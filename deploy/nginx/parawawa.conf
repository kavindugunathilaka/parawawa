# Generated by tools/build_nginx.py from vercel.json - do not edit by hand.
# Install: sudo cp deploy/nginx/parawawa.conf /etc/nginx/sites-available/parawawa.conf
#          sudo ln -s /etc/nginx/sites-available/parawawa.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d parawewa.lk -d www.parawewa.lk     (adds HTTPS + http->https redirect)

limit_req_zone $binary_remote_addr zone=parawewa_quote:10m rate=6r/m;

# www -> apex
server {
  listen 80;
  listen [::]:80;
  server_name www.parawewa.lk;
  return 301 https://parawewa.lk$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name parawewa.lk;

  root /var/www/parawawa/current;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  server_tokens off;
  error_page 404 /404.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain application/rss+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ---- redirects from the old WordPress site and renamed pages (same as vercel.json)
  location = /en { return 301 /; }
  location = /en/ { return 301 /; }
  location = /en/home { return 301 /; }
  location = /en/home/ { return 301 /; }
  location = /en/about { return 301 /#founder; }
  location = /en/about/ { return 301 /#founder; }
  location = /en/services { return 301 /#models; }
  location = /en/services/ { return 301 /#models; }
  location = /en/projects { return 301 /#customers; }
  location = /en/projects/ { return 301 /#customers; }
  location = /en/contact-us { return 301 /#contact; }
  location = /en/contact-us/ { return 301 /#contact; }
  location = /en/articles.html { return 301 /articles.html; }
  location = /en/sample-page/ { return 301 /; }
  location = /en/hello-world/ { return 301 /; }
  location = /en/category/uncategorized/ { return 301 /; }
  location = /wp-sitemap.xml { return 301 /sitemap.xml; }
  location = /articles { return 301 /articles.html; }
  location = /articles/ { return 301 /articles.html; }
  location = /si { return 301 /si/; }
  location = /si/about { return 301 /si/#founder; }
  location = /si/about/ { return 301 /si/#founder; }
  location = /si/projects { return 301 /si/#customers; }
  location = /si/projects/ { return 301 /si/#customers; }
  location = /si/contact-us { return 301 /si/#contact; }
  location = /si/contact-us/ { return 301 /si/#contact; }
  location = /systems/pump-seal-type-bio-septic-tank { return 301 /systems/seal-type-parawewa-system/; }
  location = /systems/pump-seal-type-bio-septic-tank/ { return 301 /systems/seal-type-parawewa-system/; }
  location = /articles/how-layer-base-bio-septic-tank-works { return 301 /articles/how-parawewa-bio-septic-tank-works/; }
  location = /articles/how-layer-base-bio-septic-tank-works/ { return 301 /articles/how-parawewa-bio-septic-tank-works/; }
  location = /articles/sri-lanka-patent-10848-parawewa-story { return 301 /articles/sri-lanka-patent-16371-parawewa-story/; }
  location = /articles/sri-lanka-patent-10848-parawewa-story/ { return 301 /articles/sri-lanka-patent-16371-parawewa-story/; }

  # ---- quote form -> Node service (deploy/quote-server.js)
  location = /api/quote {
    limit_req zone=parawewa_quote burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ { return 404; }

  # ---- Let's Encrypt (certbot) domain check
  location ^~ /.well-known/acme-challenge/ { default_type text/plain; try_files $uri =404; }

  # ---- never served: sources, build tools, server files
  location ~ ^/(tools|content|deploy|\.git)(/|$) { return 404; }
  location ~ /\. { return 404; }
  location ~* ^/(README\.md|vercel\.json|\.vercelignore|.*\.py)$ { return 404; }

  # ---- caching (same as vercel.json)
  location ~ ^/(style\.css|app\.js|articles-meta\.js)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ ^/assets/(fa/fa-subset|fonts/fonts)\.css$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /assets/fonts/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
  }

  location /assets/fa/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }

  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  }

  location ~ \.html$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
